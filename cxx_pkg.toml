# ============================================================================
# real-esrguisoft 的 Windows 打包配置（唯一打包入口：cxx_pkg 0.3+，TOML 配置）
#
# 打包由工作区同级项目 ../cxx_pkg 负责（通用能力：CMake 构建回退、windeployqt、
# PE 导入闭包补 DLL、zip + SHA256SUMS）。本文件只描述本项目参数，不放项目特化
# 逻辑；项目内不再维护自写打包脚本（tools/deploy.ps1 已删除）。
#
# 用法（Windows MSYS2 UCRT64，在仓库根目录；cxx_pkg 未安装时用 PYTHONPATH）：
#   set PYTHONPATH=..\cxx_pkg\src    # 工具仓库与项目同级；按本机 cxx_pkg 位置调整
#   python -m cxx_pkg -c cxx_pkg.toml --check-config
#   python -m cxx_pkg -c cxx_pkg.toml --dry-run
#   python -m cxx_pkg -c cxx_pkg.toml --list
#   python -m cxx_pkg -c cxx_pkg.toml            # 构建+打包
# Linux/macOS 上 --check-config/--dry-run 可通过（只校验配置/打印计划，不产物）；
# 实际打包仅适用于 Windows（windeployqt + PE 依赖闭包 + Windows zip）。
#
# 产物：dist/real-esrguisoft-<version>-win64.zip + SHA256SUMS（dist/ 已被 .gitignore）
#
# 说明：
#   - 项目没有 install() 规则：build.install = false 跳过安装，直接收 build-win 里的
#     target 可执行文件；避免 third_party/stacklog、singleproc 的 install() 把
#     静态库/头文件带进包（它们只对独立发布有意义）。
#   - Qt 运行时/插件由 windeployqt 部署，MSYS2 第三方 DLL（libpng/freetype/ICU/
#     FFmpeg 编解码依赖等）由 cxx_pkg 的 PE 导入闭包从 C:/msys64/ucrt64/bin 补齐；
#   - bin/realesrgan（引擎 exe + models）作为附加载荷原样入包，不加字段硬编码。
# ============================================================================

[project]
name = "real-esrguisoft"
version = "1.0.0"

[build]
system = "cmake"
source = "."
build_dir = "build-win"
target = "real-esrguisoft"
# MSYS2 第三方 DLL（Qt/FFmpeg 的依赖）搜索目录。两种常见 MSYS2 安装布局都列出，
# 不存在的目录由 cxx_pkg 自动忽略；不搜 PATH，保证产物不受开发机 shell 影响。
lib_dirs = ["C:/msys2/ucrt64/bin", "C:/msys64/ucrt64/bin"]
# 打包构建不编译/不依赖测试目标（Qt6::Test 是开发机才需要的组件；静态审查 C2）
cmake_args = "-G Ninja -DCMAKE_BUILD_TYPE=Release -DRESR_BUILD_TESTS=OFF"
# 主程序没有 install() 规则：跳过安装，直接收构建目录里的 target（见文件头说明）
install = false

[package]
formats = "zip"
out_dir = "dist"
checksums = true
# 引擎目录用白名单收录：整目录 dirs 会把本地测试产出的图片（rr-fmt-test.*）
# 一并打进包；新增引擎文件时在这里补一行。
files = [
    "README.md:README.md",
    "LICENSE:LICENSE",
    "bin/realesrgan/realesrgan-ncnn-vulkan.exe:bin/realesrgan/realesrgan-ncnn-vulkan.exe",
    "bin/realesrgan/vcomp140.dll:bin/realesrgan/vcomp140.dll",
    "bin/realesrgan/vcomp140d.dll:bin/realesrgan/vcomp140d.dll",
]
dirs = ["bin/realesrgan/models:bin/realesrgan/models"]

[qt]
enabled = "auto"
# 不写死 prefix：默认用 PATH 中的 qmake / windeployqt 定位 Qt（qmake -query）。
# 若 Qt 不在 PATH，再按本机安装位置显式填写，例如：
#   prefix = "C:/msys64/ucrt64"
# 写死的单机路径会让换机后 qt.prefix 预检直接失败（本仓库在 C:/msys2 与
# C:/msys64 两种 MSYS2 安装布局下都要可用）。
