# ============================================================================
# real-esrguisoft 的 Windows 打包配置（唯一打包入口：cxx_pkg 0.3+）
#
# 打包由工作区同级项目 ../cxx_pkg 负责（通用能力：CMake 构建回退、windeployqt、
# PE 导入闭包补 DLL、zip + SHA256SUMS）。本文件只描述本项目参数，不放项目特化
# 逻辑；项目内不再维护自写打包脚本（tools/deploy.ps1 已删除）。
#
# 用法（Windows MSYS2 UCRT64，在仓库根目录）：
#   python C:/Users/yxl/Desktop/code/cxx_pkg/cxx_pkg.py -c cxx_pkg.ini --check-config
#   python C:/Users/yxl/Desktop/code/cxx_pkg/cxx_pkg.py -c cxx_pkg.ini --dry-run
#   python C:/Users/yxl/Desktop/code/cxx_pkg/cxx_pkg.py -c cxx_pkg.ini --list
#   python C:/Users/yxl/Desktop/code/cxx_pkg/cxx_pkg.py -c cxx_pkg.ini   # 构建+打包
#
# 产物：dist/real-esrguisoft-<version>-win64.zip + SHA256SUMS（dist/ 已被 .gitignore）
# 说明：
#   - 项目没有 install() 规则，cxx_pkg 回退复制 build-win 里的 target 可执行文件；
#   - Qt 运行时/插件由 windeployqt 部署，MSYS2 第三方 DLL（libpng/freetype/ICU/
#     FFmpeg 编解码依赖等）由 cxx_pkg 的 PE 导入闭包从 C:/msys64/ucrt64/bin 补齐；
#   - bin/realesrgan（引擎 exe + models）作为附加载荷原样入包，不加字段硬编码。
# ============================================================================

[project]
name = real-esrguisoft
version = 1.0.0

[build]
system = cmake
source = .
build_dir = build-win
target = real-esrguisoft
# 打包构建不编译/不依赖测试目标（Qt6::Test 是开发机才需要的组件；静态审查 C2）
cmake_args = -G Ninja -DCMAKE_BUILD_TYPE=Release -DRESR_BUILD_TESTS=OFF

[package]
formats = zip
out_dir = dist
checksums = true
files = README.md:README.md, LICENSE:LICENSE
dirs = bin/realesrgan:bin/realesrgan

[qt]
enabled = auto
prefix = C:/msys64/ucrt64
