# cxx_audit 配置 —— stacklog
#
# 在仓库根目录运行：
#     PYTHONPATH=../cxx_audit/src python3 -m cpp_audit -c audit.toml all
#
# 单项：
#     ... cpp_audit -c audit.toml tidy
#     ... cpp_audit -c audit.toml cpd
#     ... cpp_audit -c audit.toml valgrind
#     ... cpp_audit -c audit.toml build --kind asan
[project]
name = "stacklog"
root = "."
sources = ["src", "include", "tests", "examples/cpp_demo"]
excludes = ["build", ".git", "docs", "reports", "ci-logs"]
build_system = "cmake"
project_file = "CMakeLists.txt"
build_dir = "build/audit"
target = "stacklog_integration_rotation_stress_flow"

[compat]
# 本项目明确要求 C++11；compat 规则面向 C++98，启用只会产生系统性误报。
enabled = false
rules = []

[tidy]
enabled = true
# clang-tidy 检查集由项目根目录 .clang-tidy 提供。
fail_on_warnings = true

[cpd]
enabled = true
dirs = ["src", "include"]
min_tokens = 70

[asan]
# 默认启用（ASan 是默认内存检查门禁）。2026-11-17 在普通 Linux（Ubuntu 24.04
# x86_64 / GCC 15.2）上以 -fsanitize=address 构建并跑通 12 个 unit/integration/
# smoke 测试。当前 honor 的 PRoot 容器因 shadow 映射限制无法初始化
# （sanitizer_allocator_primary64.h 的 CHECK 失败，见 reports/asan.txt），属特殊
# 环境，不是代码问题；仅在该受限容器临时验证时可改 false 并在结果中注明，不要
# 提交为默认值。Windows 上本项按平台跳过。
enabled = true
build_dir = "build/asan"
compiler = "clang++"
cxxflags = ["-std=c++11", "-fsanitize=address",
            "-fsanitize-address-use-after-return=always",
            "-fno-omit-frame-pointer", "-g", "-O0"]
ldflags = ["-fsanitize=address"]
checks = ["detect_leaks", "detect_stack_use_after_return"]
options = { halt_on_error = "0", symbolize = "1" }
timeout_sec = 120

[valgrind]
enabled = true
build_dir = "build/debug"
compiler = "clang++"
cxxflags = ["-std=c++11", "-g", "-O0"]
tool = "memcheck"
checks = ["leaks"]
extra_args = ["--undef-value-errors=no",
              "--errors-for-leak-kinds=definite,indirect"]
timeout_sec = 180

[reports]
dir = "reports"
