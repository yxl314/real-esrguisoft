# ci 配置：real-esrguisoft 的构建/测试流水线（cxx_ci ci_tool）
#
# 用法（在本仓库根目录执行）：
#   python3 ../cxx_ci/check.py ci --root .                  # clean -> configure -> build -> test
#   PYTHONPATH=../cxx_ci/src python3 -m cxx_ci.ci_tool -c ci.toml --check-config
#   PYTHONPATH=../cxx_ci/src python3 -m cxx_ci.ci_tool -c ci.toml --dry-run
#   PYTHONPATH=../cxx_ci/src python3 -m cxx_ci.ci_tool -c ci.toml --steps clean,configure,build
#   python3 ../cxx_ci/check.py ci --root . --jobs 8
# 仓库根 ./check.sh 是 ci/style/audit 三个门禁的薄壳（all|ci|style|audit）。
#
# 平台说明（完整差异见 docs/ci.md）：
#   - 目标环境：Windows 10/11 + MSYS2 UCRT64（Qt 6.11.2 / GCC 16.2 / Ninja / FFmpeg 9.0.2）。
#   - Linux 开发机（Qt 6.10.2 + 系统 FFmpeg 8）用同一份配置跑通 clean/configure/build/test：
#     resr_tests 中依赖 Windows 版 realesrgan 引擎的 4 条链路用例会自动 QSKIP（平台限制，
#     原因写入测试输出），其余用例与 resr_media_tests 全部通过。
#
# 退出码：0 全过；1 阶段失败；2 配置/用法错误；130 用户中断。

name = "real-esrguisoft"
build_system = "cmake"
source_dir = "."
# 流水线专用构建目录（与手工 build/、build-* 隔离），clean 阶段整个删除重建。
build_dir = "build/ci"

# 生成器显式指定 Ninja：Windows 上 CMake 默认可能落到 nmake / Visual Studio
# 生成器（交接文档 §8.1-1 点名的坑），而本工程按 MSYS2 UCRT64 + Ninja 验证。
configure_args = [
    "-G", "Ninja",
    "-DCMAKE_BUILD_TYPE=Release",
    # 供 IDE / clang-tidy 复用（cxx_audit 的 tidy 检查可指向 build/ci 的编译数据库）。
    "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON",
]
# CMake 的并行度由 --jobs 以 `cmake --build . --parallel N` 传入，这里不写 -jN。
build_args = []

[env]
# Windows/MSYS2 UCRT64 的 Qt/依赖安装前缀。cxx_ci 的 ci_tool 把 [env] 合并进所有阶段的
# 子进程环境，所以 PowerShell 里只需一条命令即可跑流水线。
# Linux 上该路径不存在，CMake 会直接忽略（已实测 configure/build 通过）；
# 若本机 Qt 装在别处，改这里或删掉此行、在 shell 里自行设置 CMAKE_PREFIX_PATH。
CMAKE_PREFIX_PATH = "C:/msys64/ucrt64"

[tools]
# CMake 自动构建只调用 cmake 与 ctest；make 仅在 qmake/自定义构建时才会用。
# 显式写 mingw32-make：ci_tool 在 Windows 上默认 make=nmake，那是 qmake 时代的
# 坑；本工程若切到 qmake 或自定义 make 构建，也必须是 MSYS2 的 make。
cmake = "cmake"
make = "mingw32-make"
ctest = "ctest"

[test]
# 测试注册在工程根 CMakeLists.txt（RESR_BUILD_TESTS=ON，默认）下，ctest 在
# build/ci 里运行；--output-on-failure 由 ci_tool 自动追加。
# 排除真实 GPU 引擎用例（LABELS engine，默认也不注册；这里再兜底一层）：
# 避免 CI/开发机跑 `ci` 流水线直接启动 realesrgan 触发环境 TDR（静态审查 A1）。
framework = "ctest"
args = ["-LE", "engine"]

# 测试用无头 Qt 平台；当前用例均为 QTEST_GUILESS_MAIN，保留此项防止后续
# 新增 GUI 相关测试时在 CI 里找显示器。
[test.env]
QT_QPA_PLATFORM = "offscreen"

[output]
# 降噪：构建只显示警告/错误，测试只显示跳过/失败；失败命令始终打印完整输出。
# 完整日志保留在 build/ci-logs/（位于被忽略的 build/ 下，不污染工作区）。
build = "warnings"
test = "failures"
dir = "build/ci-logs"
